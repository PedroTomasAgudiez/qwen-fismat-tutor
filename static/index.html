<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QwenFisMat Tutor</title>

  <!-- Marked.js para Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- MathJax configuración -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      chtml: {
        scale: 0.92,
        minScaleAdjust: 0.75
      },
      options: {
        enableMenu: false
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #e5e7eb;
      line-height: 1.6;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
    }

    h1 {
      font-size: 1.4rem;
      margin: 0 0 4px 0;
      color: #f8fafc;
    }

    .subtitle {
      color: #94a3b8;
      margin: 0 0 14px 0;
      font-size: 0.9rem;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px;
      background-color: #111827;
      margin-bottom: 12px;
    }

    .msg {
      max-width: 88%;
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 12px;
      font-size: 0.95rem;
      line-height: 1.65;
      word-wrap: break-word;
      overflow-wrap: break-word;
      box-sizing: border-box;
    }

    .user {
      background-color: #2563eb;
      color: #ffffff;
      margin-left: auto;
      border-bottom-right-radius: 4px;
      white-space: pre-wrap;
    }

    .assistant {
      background-color: #1f2937;
      border: 1px solid #374151;
      color: #e5e7eb;
      border-bottom-left-radius: 4px;
    }

    /* Estilos Markdown */
    .assistant p { margin: 0.45em 0; }
    .assistant p:first-child { margin-top: 0; }
    .assistant p:last-child { margin-bottom: 0; }
    .assistant ul, .assistant ol { padding-left: 20px; margin: 0.5em 0; }
    .assistant li { margin: 0.2em 0; }
    .assistant h1, .assistant h2, .assistant h3 {
      margin: 0.7em 0 0.35em 0;
      color: #f8fafc;
      line-height: 1.3;
    }
    .assistant h1 { font-size: 1.25em; }
    .assistant h2 { font-size: 1.15em; }
    .assistant h3 { font-size: 1.05em; }
    .assistant strong { color: #f8fafc; }
    .assistant em { color: #cbd5e1; }

    .assistant code {
      background-color: #0f172a;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Fira Code', 'Consolas', monospace;
      font-size: 0.88em;
      color: #60a5fa;
    }

    .assistant pre {
      background-color: #0f172a;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      border: 1px solid #334155;
      margin: 0.7em 0;
    }

    .assistant pre code {
      background-color: transparent;
      padding: 0;
      color: #e5e7eb;
      font-size: 0.85em;
    }

    .assistant blockquote {
      border-left: 3px solid #475569;
      padding-left: 12px;
      color: #94a3b8;
      margin: 0.5em 0;
    }

    .assistant table {
      border-collapse: collapse;
      margin: 0.7em 0;
      width: 100%;
      font-size: 0.9em;
    }
    .assistant th, .assistant td {
      border: 1px solid #374151;
      padding: 6px 10px;
      text-align: left;
    }
    .assistant th { background-color: #0f172a; color: #f8fafc; }

    /* MathJax: control de tamaño y desbordamiento */
    .assistant mjx-container {
      display: inline-block;
      max-width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      vertical-align: middle;
      padding: 1px 0;
    }

    .assistant mjx-container[display="true"] {
      display: block;
      margin: 0.8em 0;
      text-align: center;
    }

    .assistant mjx-container::-webkit-scrollbar { height: 4px; }
    .assistant mjx-container::-webkit-scrollbar-thumb {
      background-color: #475569;
      border-radius: 2px;
    }

    /* Formulario */
    .input-area {
      display: grid;
      grid-template-columns: 150px 1fr auto auto;
      gap: 10px;
      align-items: end;
    }

    select, textarea, button {
      border-radius: 10px;
      border: 1px solid #475569;
      padding: 10px 12px;
      font-size: 0.92rem;
      font-family: inherit;
      box-sizing: border-box;
    }

    select, textarea {
      background-color: #020617;
      color: #e5e7eb;
    }

    textarea {
      min-height: 50px;
      max-height: 120px;
      resize: vertical;
    }

    button {
      cursor: pointer;
      border: none;
      background-color: #2563eb;
      color: #ffffff;
      font-weight: 600;
      transition: background-color 0.2s;
      white-space: nowrap;
    }
    button:hover { background-color: #1d4ed8; }
    button.secondary { background-color: #334155; }
    button.secondary:hover { background-color: #475569; }

    .status {
      margin-top: 8px;
      color: #94a3b8;
      font-size: 0.8rem;
      text-align: center;
    }

    @media (max-width: 700px) {
      .input-area { grid-template-columns: 1fr; }
      .msg { max-width: 95%; font-size: 0.9rem; }
      .container { padding: 10px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧮 QwenFisMat Tutor</h1>
    <div class="subtitle">Tutor multiagente de física y matemáticas universitarias.</div>

    <div id="chat"></div>

    <div class="input-area">
      <select id="mode" title="Modo del agente">
        <option>Auto</option>
        <option>Tutoría</option>
        <option>Plan</option>
        <option>Matemáticas</option>
        <option>Física</option>
        <option>Resolver</option>
        <option>Verificar</option>
        <option>Crítico</option>
        <option>Ejercicios</option>
        <option>Evaluación</option>
        <option>Laboratorio</option>
        <option>Documentos</option>
        <option>Memoria</option>
        <option>Metacognición</option>
        <option>Seguridad</option>
        <option>Analítica</option>
        <option>Multinivel</option>
        <option>Recuperación</option>
      </select>

      <textarea
        id="message"
        placeholder="Escriba su pregunta de física o matemáticas..."
      ></textarea>

      <button type="button" id="send-btn">Enviar</button>
      <button type="button" class="secondary" id="new-session">Nueva sesión</button>
    </div>

    <div class="status" id="status">Sesión lista.</div>
  </div>

  <script>
    // Esperar a que el DOM esté listo
    document.addEventListener('DOMContentLoaded', function() {
      
      var chat = document.getElementById("chat");
      var messageInput = document.getElementById("message");
      var modeSelect = document.getElementById("mode");
      var statusEl = document.getElementById("status");
      var sendBtn = document.getElementById("send-btn");
      var newSessionBtn = document.getElementById("new-session");

      // Configurar marked si está disponible
      if (typeof marked !== 'undefined' && marked.setOptions) {
        marked.setOptions({
          breaks: true,
          gfm: true
        });
      }

      function getSessionId() {
        var sessionId = localStorage.getItem("qwen_fismat_session");
        if (!sessionId) {
          sessionId = Date.now().toString(36) + Math.random().toString(36).substring(2);
          localStorage.setItem("qwen_fismat_session", sessionId);
        }
        return sessionId;
      }

      var sessionId = getSessionId();

      function addMessage(role, text) {
        var div = document.createElement("div");
        div.className = "msg " + role;

        if (role === "assistant") {
          // Convertir Markdown a HTML si marked está disponible
          if (typeof marked !== 'undefined' && marked.parse) {
            div.innerHTML = marked.parse(text);
          } else {
            div.textContent = text;
          }

          // Renderizar LaTeX si MathJax está disponible
          if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise([div]).catch(function(err) {
              console.error("MathJax error:", err);
            });
          }
        } else {
          div.textContent = text;
        }

        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
      }

      function setStatus(text) {
        statusEl.textContent = text;
      }

      function sendMessage() {
        var message = messageInput.value.trim();
        if (!message) return;

        addMessage("user", message);
        messageInput.value = "";
        setStatus("Consultando al tutor...");
        sendBtn.disabled = true;

        fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            session_id: sessionId,
            mode: modeSelect.value,
            message: message
          })
        })
        .then(function(response) { return response.json(); })
        .then(function(data) {
          sendBtn.disabled = false;
          if (data.error) {
            addMessage("assistant", data.error);
            setStatus("Error.");
            return;
          }
          if (data.session_id) {
            sessionId = data.session_id;
            localStorage.setItem("qwen_fismat_session", sessionId);
          }
          addMessage("assistant", data.answer || "Sin respuesta.");
          setStatus("Respuesta recibida.");
        })
        .catch(function(error) {
          sendBtn.disabled = false;
          addMessage("assistant", "Error de conexión con el backend.");
          setStatus("Error de conexión.");
          console.error("Fetch error:", error);
        });
      }

      // Event listeners
      sendBtn.addEventListener("click", sendMessage);

      messageInput.addEventListener("keydown", function(e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      newSessionBtn.addEventListener("click", function() {
        sessionId = Date.now().toString(36) + Math.random().toString(36).substring(2);
        localStorage.setItem("qwen_fismat_session", sessionId);
        chat.innerHTML = "";
        setStatus("Nueva sesión creada.");
      });

      // Mensaje de bienvenida
      addMessage("assistant", "¡Hola! Soy tu tutor de física y matemáticas. ¿En qué puedo ayudarte hoy?");
    });
  </script>
</body>
</html>
