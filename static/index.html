<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QwenFisMat Tutor</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #94a3b8;
      margin-bottom: 16px;
      font-size: 0.95rem;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      background: #111827;
      margin-bottom: 14px;
    }

    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 12px;
      white-space: pre-wrap;
      line-height: 1.45;
    }

    .user {
      background: #2563eb;
      color: white;
      margin-left: auto;
    }

    .assistant {
      background: #1f2937;
      border: 1px solid #374151;
      color: #e5e7eb;
    }

    form {
      display: grid;
      grid-template-columns: 170px 1fr auto auto;
      gap: 10px;
    }

    select,
    textarea,
    button {
      border-radius: 10px;
      border: 1px solid #475569;
      padding: 10px 12px;
      font-size: 0.95rem;
    }

    select,
    textarea {
      background: #020617;
      color: #e5e7eb;
    }

    textarea {
      min-height: 52px;
      resize: vertical;
    }

    button {
      cursor: pointer;
      border: none;
      background: #2563eb;
      color: white;
      font-weight: bold;
    }

    button.secondary {
      background: #334155;
    }

    .status {
      margin-top: 10px;
      color: #94a3b8;
      font-size: 0.88rem;
    }

    @media (max-width: 800px) {
      form {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>🧮 QwenFisMat Tutor</h1>
    <div class="subtitle">
      Tutor multiagente de física y matemáticas basado en Qwen-Agent
    </div>

    <div id="chat"></div>

    <form id="chat-form">
      <select id="mode">
        <option>Auto</option>
        <option>Tutoría</option>
        <option>Plan</option>
        <option>Matemáticas</option>
        <option>Física</option>
        <option>Resolver</option>
        <option>Verificar</option>
        <option>Crítico</option>
        <option>Ejercicios</option>
        <option>Evaluación</option>
        <option>Laboratorio</option>
        <option>Documentos</option>
        <option>Memoria</option>
        <option>Metacognición</option>
        <option>Seguridad</option>
        <option>Analítica</option>
        <option>Multinivel</option>
        <option>Recuperación</option>
      </select>

      <textarea
        id="message"
        placeholder="Escriba su pregunta de física o matemáticas..."
        required
      ></textarea>

      <button type="submit">Enviar</button>
      <button type="button" class="secondary" id="new-session">
        Nueva sesión
      </button>
    </form>

    <div class="status" id="status">
      Sesión lista.
    </div>
  </main>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("chat-form");
    const messageInput = document.getElementById("message");
    const modeSelect = document.getElementById("mode");
    const statusEl = document.getElementById("status");
    const newSessionBtn = document.getElementById("new-session");

    function getSessionId() {
      let sessionId = localStorage.getItem("qwen_fismat_session");
      if (!sessionId) {
        sessionId = crypto.randomUUID
          ? crypto.randomUUID()
          : Date.now().toString(36) + Math.random().toString(36).slice(2);
        localStorage.setItem("qwen_fismat_session", sessionId);
      }
      return sessionId;
    }

    let sessionId = getSessionId();

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function setStatus(text) {
      statusEl.textContent = text;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const message = messageInput.value.trim();
      if (!message) return;

      addMessage("user", message);
      messageInput.value = "";
      setStatus("Consultando al tutor...");

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            session_id: sessionId,
            mode: modeSelect.value,
            message: message
          })
        });

        const data = await response.json();

        if (!response.ok) {
          addMessage("assistant", data.error || "Error del servidor.");
          setStatus("Error.");
          return;
        }

        sessionId = data.session_id || sessionId;
        localStorage.setItem("qwen_fismat_session", sessionId);

        addMessage("assistant", data.answer || "Sin respuesta.");
        setStatus("Respuesta recibida.");
      } catch (error) {
        addMessage("assistant", "Error de conexión con el backend.");
        setStatus("Error de conexión.");
      }
    });

    newSessionBtn.addEventListener("click", () => {
      sessionId = crypto.randomUUID
        ? crypto.randomUUID()
        : Date.now().toString(36) + Math.random().toString(36).slice(2);

      localStorage.setItem("qwen_fismat_session", sessionId);
      chat.innerHTML = "";
      setStatus("Nueva sesión creada.");
    });
  </script>
</body>
</html>
