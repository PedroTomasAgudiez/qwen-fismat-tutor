<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QwenFisMat Tutor</title>

  <!-- Marked.js para Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Configuración de MathJax ANTES de cargar la librería -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        packages: {'[+]': ['ams']}
      },
      loader: {
        load: ['[tex]/ams']
      },
      chtml: {
        scale: 0.92,
        minScaleAdjust: 0.75,
        mtextInheritFont: true
      },
      options: {
        enableMenu: false,
        renderActions: {
          addMenu: []
        }
      },
      startup: {
        ready: () => {
          MathJax.startup.defaultReady();
          MathJax.startup.promise.then(() => {
            console.log('MathJax inicializado correctamente');
          });
        }
      }
    };
  </script>

  <!-- Motor CHTML (más predecible que SVG para tamaños) -->
  <script type="text/javascript" id="MathJax-script" async
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js">
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { font-size: 16px; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      line-height: 1.6;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 4px;
      color: #f8fafc;
    }

    .subtitle {
      color: #94a3b8;
      margin-bottom: 14px;
      font-size: 0.9rem;
    }

    /* ===== ÁREA DE CHAT ===== */
    #chat {
      flex: 1;
      overflow-y: auto;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px;
      background: #111827;
      margin-bottom: 12px;
      scroll-behavior: smooth;
    }

    .msg {
      max-width: 88%;
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 12px;
      font-size: 0.95rem;
      line-height: 1.65;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .user {
      background: #2563eb;
      color: #ffffff;
      margin-left: auto;
      border-bottom-right-radius: 4px;
      white-space: pre-wrap;
    }

    .assistant {
      background: #1f2937;
      border: 1px solid #374151;
      color: #e5e7eb;
      border-bottom-left-radius: 4px;
    }

    /* ===== ESTILOS MARKDOWN DENTRO DE RESPUESTAS ===== */
    .assistant p { margin: 0.45em 0; }
    .assistant p:first-child { margin-top: 0; }
    .assistant p:last-child { margin-bottom: 0; }

    .assistant ul, .assistant ol {
      padding-left: 20px;
      margin: 0.5em 0;
    }

    .assistant li { margin: 0.2em 0; }

    .assistant h1, .assistant h2, .assistant h3, .assistant h4 {
      margin: 0.7em 0 0.35em 0;
      color: #f8fafc;
      line-height: 1.3;
    }
    .assistant h1 { font-size: 1.25em; }
    .assistant h2 { font-size: 1.15em; }
    .assistant h3 { font-size: 1.05em; }

    .assistant strong { color: #f8fafc; }
    .assistant em { color: #cbd5e1; }

    .assistant code {
      background: #0f172a;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Fira Code', 'Consolas', monospace;
      font-size: 0.88em;
      color: #60a5fa;
    }

    .assistant pre {
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      border: 1px solid #334155;
      margin: 0.7em 0;
    }

    .assistant pre code {
      background: transparent;
      padding: 0;
      color: #e5e7eb;
      font-size: 0.85em;
    }

    .assistant blockquote {
      border-left: 3px solid #475569;
      padding-left: 12px;
      color: #94a3b8;
      margin: 0.5em 0;
    }

    .assistant table {
      border-collapse: collapse;
      margin: 0.7em 0;
      width: 100%;
      font-size: 0.9em;
    }
    .assistant th, .assistant td {
      border: 1px solid #374151;
      padding: 6px 10px;
      text-align: left;
    }
    .assistant th { background: #0f172a; color: #f8fafc; }

    .assistant hr {
      border: none;
      border-top: 1px solid #374151;
      margin: 0.8em 0;
    }

    /* El tamaño se controla principalmente desde la config JS (scale: 0.92).
       Este CSS actúa como red de seguridad adicional. */

    .assistant mjx-container {
      display: inline-block;
      max-width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      vertical-align: middle;
